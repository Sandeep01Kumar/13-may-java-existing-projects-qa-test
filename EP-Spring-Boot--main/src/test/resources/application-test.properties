# ============================================================
# Spring `test` profile - Test Classpath Configuration
# ============================================================
# Activated by @ActiveProfiles("test") on the test classes in
# src/test/java/com/jspider/spring_boot_simple_crud_with_mysql/.
# This profile OVERRIDES production-hardened settings from
# src/main/resources/application.properties so tests run
# WITHOUT external MySQL, WITHOUT a PKCS12 keystore, and
# WITHOUT the DB_USERNAME/DB_PASSWORD/KEYSTORE_PASSWORD/
# CORS_ALLOWED_ORIGINS environment variables.
# ============================================================

# ------------------------------------------------------------
# H2 in-memory datasource (overrides production MySQL+TLS URL)
# MODE=MySQL: accept MySQL-syntax SQL where reasonable so the
# native @Query annotations in ProductRepository work.
# DB_CLOSE_DELAY=-1: keep the in-memory DB alive across the
# entire test run.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
# JPA / Hibernate (test schema is generated from entities,
# overriding production `validate`)
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ------------------------------------------------------------
# Embedded server (TLS disabled in tests; random port)
# Sidesteps the PKCS12 keystore provisioning requirement.
# ------------------------------------------------------------
server.ssl.enabled=false
server.port=0

# ------------------------------------------------------------
# Test user (used for tests that do not supply @WithMockUser)
# ------------------------------------------------------------
spring.security.user.name=test
spring.security.user.password=test

# ------------------------------------------------------------
# CORS allow-list (matches the SecurityConfigTest assertion)
# ------------------------------------------------------------
app.cors.allowed-origins=https://localhost:8443

# ------------------------------------------------------------
# Bucket4j rate limiting (production defaults; one test
# overrides these via @TestPropertySource to a lower capacity)
# ------------------------------------------------------------
app.security.rate-limit.capacity=100
app.security.rate-limit.refill-tokens=100
app.security.rate-limit.refill-period-seconds=60

# ------------------------------------------------------------
# Springdoc disabled in tests (no OpenAPI/Swagger noise)
# ------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
