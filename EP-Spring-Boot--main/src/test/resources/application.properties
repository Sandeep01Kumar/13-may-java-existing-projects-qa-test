# =============================================================================
# Test-scope configuration override
# -----------------------------------------------------------------------------
# This file is loaded by Spring Boot only during the Maven `test` lifecycle
# phase (it sits on the test classpath under src/test/resources and overrides
# the production src/main/resources/application.properties when the test JVM
# is running).
#
# Purpose: Replace the MySQL datasource referenced by the production
# configuration (jdbc:mysql://localhost:3306/spring-m12) with the H2
# in-memory database that is already declared as a runtime dependency in
# pom.xml. This allows the existing @SpringBootTest contextLoads() smoke test
# to boot the full Spring context (including JPA/Hibernate auto-configuration)
# without requiring an external MySQL server to be reachable from the build
# environment.
#
# Production behaviour is unchanged: src/main/resources/application.properties
# still drives the production runtime against MySQL.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
