# ============================================================
# Production Profile Overrides
# Activated when spring.profiles.active=prod.
# Per AAP 0.6.3, this profile hardens the deployment by:
#   - Hiding OpenAPI / Swagger UI surfaces (no API self-discovery)
#   - Disabling the H2 console (defense-in-depth)
#   - Reducing log verbosity (prevents accidental leakage)
#   - Disabling Spring Boot DevTools (no auto-restart in prod)
#
# This file contains ONLY behavior toggles and log levels.
# It MUST NOT contain any plaintext credentials, secrets,
# API keys, or connection strings. Environment-specific
# secrets (DB_USERNAME, DB_PASSWORD, KEYSTORE_PASSWORD,
# CORS_ALLOWED_ORIGINS) are supplied through environment
# variables that are resolved by the base application.properties.
# ============================================================

# ------------------------------------------------------------
# OpenAPI / Swagger UI -- DISABLED IN PRODUCTION
# Closes the API self-discovery surface noted in AAP 0.3.3.
# Without these toggles, an unauthenticated attacker could
# retrieve the entire REST contract from /v3/api-docs and
# /swagger-ui/index.html. springdoc-openapi-starter-webmvc-ui
# remains on the classpath (still useful for the dev profile)
# but is rendered inert when the prod profile is active.
# ------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ------------------------------------------------------------
# H2 Console -- DISABLED IN PRODUCTION
# Defense-in-depth: production uses MySQL, but the H2 console
# must remain off even if H2 is accidentally on the classpath.
# Leaving the H2 console enabled in production would expose
# an unauthenticated, browser-accessible SQL shell on
# /h2-console -- catastrophic in an internet-exposed service.
# ------------------------------------------------------------
spring.h2.console.enabled=false

# ------------------------------------------------------------
# Logging Levels -- HARDENED FOR PRODUCTION
# WARN-level for framework noise; INFO for Spring Security so
# auth failures and access-denied events remain visible.
# Rationale:
#   org.springframework.web   -> WARN suppresses request/response
#                                logging that could leak headers,
#                                query parameters, or payload
#                                fragments (mitigates CWE-532).
#   org.hibernate             -> WARN suppresses SQL/binding/
#                                diagnostic noise; complements
#                                spring.jpa.show-sql=false in base.
#   org.springframework.security -> INFO keeps auth failures and
#                                denied-access events visible
#                                without DEBUG/TRACE chattiness.
# ------------------------------------------------------------
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO

# ------------------------------------------------------------
# Spring Boot DevTools -- DISABLED IN PRODUCTION
# DevTools auto-restart and LiveReload have no place in prod.
# DevTools auto-disables when running a packaged JAR via
# java -jar, but explicitly setting these toggles is belt-and-
# suspenders for unusual deployment scenarios (e.g., running
# via spring-boot:run on a production host, or when devtools
# is unintentionally bundled into the runnable artifact).
# ------------------------------------------------------------
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
