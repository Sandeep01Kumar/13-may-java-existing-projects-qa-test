# Rule Applied — error-attribute hardening (QA CP2 Issue #6)
# Spring Boot's default BasicErrorController echoes a full Java stack trace,
# the exception class name, and binding error details into every error
# response body. That is a well-known production-hardening miss and leaks
# internal package structure (com.jspider.*), Spring/Tomcat internals, and
# JVM thread layout to anyone hitting an unmapped or failing endpoint.
# Forcing every include-* attribute to "never" / "false" reduces the
# default error body to {timestamp,status,error,path} only and works in
# tandem with the project's @RestControllerAdvice (GlobalExceptionHandler)
# which intercepts the common application exceptions BEFORE BasicErrorController
# is reached and shapes them into the project-wide ResponseStructure envelope.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
