# ============================================================
# Application Identity
# ============================================================
spring.application.name=spring-boot-simple-crud-with-mysql

# ============================================================
# Server / TLS Configuration
# Closes AAP finding #5 (CWE-319 plaintext HTTP).
# The keystore.p12 is provisioned at deploy time and must NOT
# be committed to the repository.
# ============================================================
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-alias=tomcat

# ============================================================
# Datasource (TLS-enabled JDBC, externalized credentials)
# Closes AAP findings #6 (CWE-319 plaintext JDBC) and
# #7 (CWE-798/CWE-256 hard-coded credentials).
# DB_PASSWORD has NO default: the application will fail-closed
# at startup if the environment does not supply it.
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/spring-m12?useSSL=true&requireSSL=true&verifyServerCertificate=true
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# JPA / Hibernate (hardened)
# Closes AAP findings #12 (CWE-1188 ddl-auto=update silent
# schema drift) and #13 (CWE-532 SQL parameter logging).
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ============================================================
# Security: CORS allow-list
# Consumed by SecurityConfig.corsConfigurationSource() via
# @Value("${app.cors.allowed-origins}").
# Dev default points at the local HTTPS origin.
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:8443}

# ============================================================
# Security: Rate limiting (Bucket4j per-IP token bucket)
# Bound to RateLimitingProperties via @ConfigurationProperties.
# Defaults: 100 requests per 60 seconds per remote IP.
# ============================================================
app.security.rate-limit.capacity=100
app.security.rate-limit.refill-tokens=100
app.security.rate-limit.refill-period-seconds=60
